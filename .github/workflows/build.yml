name: Build APK Ultimate

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v3

      - name: Setup Java & Android SDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          # Ini kunci utamanya: setup-java akan otomatis download & setup SDK
          android-sdk-version: '34' 
          # Agar gradle cache lebih cepat
          cache: 'gradle'

      - name: Set Android Home Environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "SDK_DIR=$ANDROID_HOME" >> $GITHUB_ENV
          # Memastikan local.properties ada
          echo "sdk.dir=$ANDROID_HOME" >> local.properties

      - name: Give Execution Permission
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WA_Tracker_Final
          path: app/build/outputs/apk/release/app-release-unsigned.apk
